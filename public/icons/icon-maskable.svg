<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>
  
  <!-- Full Bleed Background for Maskable Icon -->
  <rect width="512" height="512" fill="url(#bgGrad)" />
  
  <!-- Safe Zone Elements (within 400x400 circle) -->
  <!-- Outer Ring with Dash -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#primaryGrad)" stroke-width="6" opacity="0.4" stroke-dasharray="14 10" />

  <!-- Shield / Lock Geometric Icon -->
  <g transform="translate(171, 155) scale(0.85)">
    <!-- Lock Shackle -->
    <path d="M 50 100 V 60 A 50 50 0 0 1 150 60 V 100" fill="none" stroke="url(#primaryGrad)" stroke-width="20" stroke-linecap="round" />
    <!-- Lock Body -->
    <rect x="20" y="90" width="160" height="130" rx="28" fill="url(#primaryGrad)" />
    <!-- Keyhole -->
    <circle cx="100" cy="145" r="14" fill="#05070B" />
    <path d="M 94 148 L 90 180 H 110 L 106 148 Z" fill="#05070B" />
  </g>
</svg>
