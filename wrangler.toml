name = "e-cell-startup-idea"
main = "cloudflare/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Durable Objects configuration for isolated ephemeral room state
[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "RoomDurableObject" }
]

# Durable Objects Migrations (SQLite storage for Cloudflare Free & Paid tiers)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["RoomDurableObject"]

[vars]
ENVIRONMENT = "production"
APP_URL = "https://templink.in"
