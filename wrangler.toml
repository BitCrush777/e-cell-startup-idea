name = "e-cell-startup-idea"
main = "cloudflare/worker.ts"
compatibility_date = "2024-09-23"

# Durable Objects configuration for isolated ephemeral room state in volatile RAM
[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "RoomDurableObject" }
]

# Durable Objects Migrations
[[migrations]]
tag = "v1"
new_classes = ["RoomDurableObject"]

[vars]
ENVIRONMENT = "production"
APP_URL = "https://templink.in"
