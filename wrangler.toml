name = "templink-backend"
main = "cloudflare/worker.ts"
compatibility_date = "2024-09-23"

# Durable Objects configuration for isolated ephemeral room state
[durable_objects]
bindings = [
  { name = "ROOMS", class_name = "RoomDurableObject" }
]

# Durable Objects Migrations
[[migrations]]
tag = "v1"
new_classes = ["RoomDurableObject"]

# Cloudflare D1 Database binding for persistent metadata
[[d1_databases]]
binding = "DB"
database_name = "templink-d1"
database_id = "local-d1-id"

[vars]
ENVIRONMENT = "production"
APP_URL = "https://templink.app"
